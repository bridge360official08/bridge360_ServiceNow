version: '3.8'

services:
  easyocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridge360-easyocr-service
    ports:
      - "8088:8088"
    environment:
      - HOST=0.0.0.0
      - PORT=8088
      - EASYOCR_GPU=false
      - EASYOCR_MODEL_DIR=/root/.EasyOCR/model
      - MAX_REQUEST_SIZE_MB=25
      - OCR_TIMEOUT_SECONDS=60
    volumes:
      # Persist downloaded EasyOCR models between container restarts
      - easyocr-models:/root/.EasyOCR/model
    restart: unless-stopped

volumes:
  easyocr-models:
